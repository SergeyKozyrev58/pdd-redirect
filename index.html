<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сайт переехал — Сергей Козырев</title>
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=https://pddsensey.ru/">
  <link rel="canonical" href="https://pddsensey.ru/">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#071015;color:#f5f8f9;font:18px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    main{width:min(620px,100%);padding:36px;border:1px solid rgba(77,166,200,.38);border-radius:24px;background:#0c171d;text-align:center}
    h1{margin:0 0 14px;font-size:clamp(32px,7vw,54px);line-height:1.05}
    p{margin:0 0 24px;color:#b8c6cc}
    a{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:0 24px;border-radius:14px;background:#337392;color:#fff;font-weight:800;text-decoration:none}
    a:focus-visible{outline:3px solid #78aef8;outline-offset:4px}
  </style>
  <script>
    (() => {
      const destination = new URL('https://pddsensey.ru/');
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Сайт переехал</h1>
    <p>Сейчас откроется новый официальный адрес сайта Сергея Козырева.</p>
    <a href="https://pddsensey.ru/">Перейти на pddsensey.ru</a>
  </main>
</body>
</html>
